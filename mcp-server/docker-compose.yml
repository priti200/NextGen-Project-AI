version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextgen-mcp-server
    ports:
      - "8080:8080"
    environment:
      # Server Configuration
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8080
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      - MCP_DEBUG=${MCP_DEBUG:-false}
      - MCP_WORKERS=${MCP_WORKERS:-4}
      
      # CORS Settings
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      
      # LLM API Keys
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Default Model Configuration
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-pro}
      - MAX_TOKENS=${MAX_TOKENS:-2048}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://mcp_user:mcp_password@postgres:5432/mcp_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      
      # Integration APIs
      - JIRA_API_URL=${JIRA_API_URL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_API_URL=${GITHUB_API_URL:-https://api.github.com}
      
      # Security
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - API_KEY=${API_KEY}
      
      # Rate Limiting
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_PERIOD=${RATE_LIMIT_PERIOD:-60}
    
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
    
    depends_on:
      - redis
      - postgres
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - mcp-network

  redis:
    image: redis:7-alpine
    container_name: nextgen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: nextgen-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mcp_db}
      - POSTGRES_USER=${POSTGRES_USER:-mcp_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mcp_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_db"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
  postgres-data:

networks:
  mcp-network:
    driver: bridge
