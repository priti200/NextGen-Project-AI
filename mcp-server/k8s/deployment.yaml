# Kubernetes Deployment for MCP Server
apiVersion: v1
kind: Namespace
metadata:
  name: nextgen-mcp

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  namespace: nextgen-mcp
data:
  MCP_SERVER_HOST: "0.0.0.0"
  MCP_SERVER_PORT: "8080"
  MCP_LOG_LEVEL: "INFO"
  MCP_WORKERS: "4"
  DEFAULT_MODEL: "gemini-pro"
  MAX_TOKENS: "2048"
  TEMPERATURE: "0.7"

---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-server-secrets
  namespace: nextgen-mcp
type: Opaque
stringData:
  GOOGLE_API_KEY: "your_google_api_key"
  OPENAI_API_KEY: "your_openai_api_key"
  ANTHROPIC_API_KEY: "your_anthropic_api_key"
  SECRET_KEY: "your_secret_key"
  API_KEY: "your_api_key"
  JIRA_API_TOKEN: "your_jira_token"
  GITHUB_TOKEN: "your_github_token"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: nextgen-mcp
  labels:
    app: mcp-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: ghcr.io/priti200/nextgen-project-ai/mcp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: mcp-server-config
        - secretRef:
            name: mcp-server-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: nextgen-mcp
  labels:
    app: mcp-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: mcp-server

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-server-hpa
  namespace: nextgen-mcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server-ingress
  namespace: nextgen-mcp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - mcp-server.yourcompany.com
    secretName: mcp-server-tls
  rules:
  - host: mcp-server.yourcompany.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-server
            port:
              number: 8080
